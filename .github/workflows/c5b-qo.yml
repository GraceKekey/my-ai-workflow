name: Ensaio C5B-QO
on:
  push:
    branches: [c5b-qo/ensaio-terrestre-20261001]
    paths:
      - 'c5b_qo/**'
      - '.github/workflows/c5b-qo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r c5b_qo/requirements.txt
      - name: Testar invariantes e casos analíticos
        run: python -m unittest discover -s c5b_qo/tests -v
      - name: Executar ensaio e validação de convergência
        run: python c5b_qo/study.py --output resultados-c5b-qo
      - name: Registrar interpretação no resumo
        run: cat resultados-c5b-qo/relatorio.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c5b-qo-resultados
          path: resultados-c5b-qo/
          if-no-files-found: error
          retention-days: 30
