name: HRF ELETRON-67 complete registered experiment
run-name: HRF E67 full 64x74 corrected package
on:
  push:
    branches: [hrf/e67-full-20261008]
    paths:
      - 'HRF_ELETRON_67/**'
      - '.github/workflows/hrf-e67.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hrf-e67-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e67:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      E67_PROCESSOS: '2'
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      TZ: America/Sao_Paulo
    defaults:
      run:
        working-directory: HRF_ELETRON_67
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: HRF_ELETRON_67/requirements-runtime.txt
      - name: Verify registered source hashes
        run: sha256sum -c hashes_antes_da_execucao.txt
      - name: Install and record scientific dependencies
        run: |
          set -o pipefail
          python -m pip install -r requirements-runtime.txt 2>&1 | tee resultados/dependencies.log
          python -m pip freeze > ambiente_dependencias.txt
          lscpu > ambiente_cpu.txt
          free -m > ambiente_memoria.txt
      - name: Execute seven full cases with all-region nu audit
        run: |
          set -o pipefail
          python -u run_audited.py 2>&1 | tee log_console.txt
      - name: Apply original unchanged decision rules
        run: |
          set -o pipefail
          python src/avaliar_e67.py 2>&1 | tee resultados/saida_avaliacao.txt
      - name: Export audit, report, CSV and figures
        run: python build_report.py
      - name: Verify registered source remained unchanged
        if: ${{ always() }}
        run: sha256sum -c hashes_antes_da_execucao.txt > hashes_depois_da_execucao.txt
      - name: Retain complete package and all negative results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: HRF-ELETRON-67-full-corrected
          path: HRF_ELETRON_67/
          if-no-files-found: error
          retention-days: 30
