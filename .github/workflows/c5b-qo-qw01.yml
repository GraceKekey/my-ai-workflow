name: C5B-QO-QW01 wormhole
on:
  push:
    branches: [c5b-qo/qw01-20261001]
    paths: ['c5b_qo_qw01/**', '.github/workflows/c5b-qo-qw01.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/qw01-mpl
      XDG_CACHE_HOME: /tmp/qw01-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r c5b_qo_qw01/requirements.txt
      - name: Executar testes antes da grade
        run: python c5b_qo_qw01/tests/test_c5b_qo_qw01.py
      - name: Executar grade e gerar ZIP
        run: python c5b_qo_qw01/src/run_c5b_qo_qw01.py
      - name: Publicar relatório no resumo
        run: cat c5b_qo_qw01/report/C5B_QO_QW01_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C5B_QO_QW01
          path: |
            C5B_QO_QW01.zip
            c5b_qo_qw01/results/validation.json
            c5b_qo_qw01/results/test_log.txt
            c5b_qo_qw01/report/C5B_QO_QW01_REPORT.md
          if-no-files-found: error
          retention-days: 30
